<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon"  href="https://avatars.akamai.steamstatic.com/2898d52823dbfc745e6df74e0b97afeacc4d315c_full.jpg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主页</title>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@300;400;500;600&family=Roboto+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Unna:ital,wght@0,400;0,700;1,400&display=swap"
    >
    <style>
    html {
        height: 100vh;
    }

    body {
        background-color: #e9e9e9;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 0;
        font-family: Noto Sans SC;
        user-select: none;
        overflow-x: hidden;
        height: 100%;
    }

    a {text-decoration: none;}

    #menu {
        display: flex;
        flex-direction: row;
        align-items: center;
        line-height: 1rem;
        font-weight: 100;
        background-color: #e9e9e9;
        width: 100%;
        justify-content: center;
        flex: 1;
    }

    #bottom {   
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 1rem;
        font-weight: 100;
        background-color: #e9e9e9;
        width: 100%;
        justify-content: center;
    }

    #bottom a {
        color: #2a2a2e;
        transition: all .2s ease;
    }

    #bottom a:hover {
        color: #f8f8f8;
        background-color: #2a2a2e;
    }

    #menu a {
        flex: 1;
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2a2a2e;
        font-size: 5rem;
        font-weight: 700;
        transition: all .2s ease;
    }

    #menu a:hover {
        color: #f8f8f8;
        background-color: #2a2a2e;
    }

    @media (max-width: 720px) {
        #menu {
            flex-direction: column;
        }
    }
    </style>
</head>
<body>
    <div id="menu">
        <a target="_top" href="/portfolio"><span>作品集</span></a>
        <a target="_top" href="/teardown"><span>拆解案</span></a>
    </div>
    <div id="bottom">
        <a target="_top" href="http://gaplouelpew.com">GaplouelPew / KatsuK 个人站</a>
        <a target="_top" href="http://beian.miit.gov.cn">京ICP备2025154926号</a>
    </div>
</body>
</html>
